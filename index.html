<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>孫睿 | 写真</title>
  <style>
    :root {
      --bg: #fff;
      --text: #111;
      --muted: #767676;
      --line: #e9e9e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      letter-spacing: 0;
    }

    button {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .page {
      padding: 28px clamp(14px, 3vw, 42px) 42px;
    }

    .profile {
      display: grid;
      grid-template-columns: minmax(180px, 280px) minmax(240px, 520px) auto;
      gap: 28px;
      align-items: start;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
      font-size: 12px;
      line-height: 1.8;
    }

    .name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
    }

    .profile p {
      margin: 0;
      color: #333;
    }

    .count {
      justify-self: end;
      color: var(--muted);
      white-space: nowrap;
    }

    .grid {
      column-count: 4;
      column-gap: 18px;
    }

    .photo {
      display: inline-block;
      width: 100%;
      margin: 0 0 22px;
      break-inside: avoid;
    }

    .photo button {
      display: block;
      width: 100%;
      background: #f5f5f5;
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
    }

    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding-top: 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 30px;
      background: rgba(255, 255, 255, .96);
    }

    .lightbox.is-open { display: grid; }

    .lightbox img {
      max-width: 100%;
      max-height: 88vh;
      object-fit: contain;
    }

    .close {
      position: fixed;
      top: 14px;
      right: 18px;
      width: 42px;
      height: 42px;
      color: #333;
      font-size: 28px;
      line-height: 42px;
      text-align: center;
    }

    @media (max-width: 1100px) {
      .grid { column-count: 3; }
    }

    @media (max-width: 760px) {
      .page { padding: 18px 12px 32px; }
      .profile {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-bottom: 18px;
      }
      .count { justify-self: start; }
      .grid {
        column-count: 2;
        column-gap: 12px;
      }
      .photo { margin-bottom: 16px; }
      figcaption { font-size: 10px; }
    }

    @media (max-width: 420px) {
      .grid { column-count: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="profile" aria-label="プロフィール">
      <div class="name">孫睿<br>ソンレイ</div>
      <p>京都で生活しながら、街の光、静かな時間、偶然の距離を撮影しています。</p>
      <div class="count">写真 88 点</div>
    </section>

    <section class="grid" id="grid" aria-label="写真一覧"></section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="写真ビューア">
    <button class="close" id="close" aria-label="閉じる">×</button>
    <img id="lightboxImage" src="" alt="">
  </div>

    const grid = document.getElementById('grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');

    grid.innerHTML = photos.map(([number, name, src]) => `
      <figure class="photo">
        <button class="open" data-src="${src}" aria-label="${number} ${name} を開く">
          <img src="${src}" alt="${name}" loading="lazy">
        </button>
        <figcaption><span>${number}</span><span>${name}</span></figcaption>
      </figure>
    `).join('');

    grid.addEventListener('click', (event) => {
      const button = event.target.closest('.open');
      if (!button) return;
      lightboxImage.src = button.dataset.src;
      lightboxImage.alt = button.querySelector('img').alt;
      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
    });

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImage.src = '';
    }

    document.getElementById('close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeLightbox();
    });
